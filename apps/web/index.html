<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summarise</title>
    <script>
      // Light or dark before first paint, so there's no flash while React
      // loads: the choice saved by pressing D, otherwise the system setting.
      // ThemeProvider takes over from here.
      {
        let saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch {}
        const dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
